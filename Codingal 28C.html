<!DOCTYPE html>
<html>

<head>
    <title>Evaluating Functions</title>
</head>

<body>

    <script>

   function calculate(expression) {
    return eval(expression);
   }

   let result1 = calculate("52 + 84")
   let result2 = calculate("10 - 8 * 4")
   let result3 = calculate("52/3")

   console.log(result1);
   console.log(result2);
   console.log(result3);

   </script>
</body>

</html>
